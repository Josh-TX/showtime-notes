[project]
name = "showtime-notes-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "pydantic>=2.9",
    "demucs>=4.1.0",
    "beat_this>=1.1.0",
    "torchaudio==2.2.2",
    "soundfile>=0.12",
]

[project.scripts]
showtime-notes = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/static"]
